<!DOCTYPE html>
<html>
<head>

    <title>Contact Me - Eugilizer</title>

    <style>
       

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .contact-box {
            margin-bottom: 30px;
        }

        .contact-box h2,
        .social-box h2 {
            color: #1769aa;
            margin-bottom: 15px;
            border-bottom: 2px solid #1769aa;
            padding-bottom: 8px;
        }

        .item {
            display: block;
            text-decoration: none;
            color: #222;
            background: #f5f7fa;
            margin: 10px 0;
            padding: 14px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .item:hover {
            background: #1769aa;
            color: white;
            transform: translateX(5px);
        }

        .social {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .social a {
            text-decoration: none;
            color: white;
            background: #333;
            padding: 14px;
            text-align: center;
            border-radius: 10px;
            transition: 0.3s;
        }

        
    </style>
</head>

<body>

    <div class="container">

        <h1>CONTACT ME</h1>

       

        <!-- CONTACT INFORMATION -->
        <div class="contact-box">

            <h2>📞 Contact Information</h2>

            </a>

            <a class="item" href="tel:0790425279">
                📱 Phone: 0790425279
            </a>

            <div class="item">
                📍 Location: Kisii, Kenya
            </div>

            <a class="item" href="https://wa.me/254790425279" target="_blank">
                💬 WhatsApp: 0790425279
            </a>

        </div>



        <footer>

</body>
</html>
